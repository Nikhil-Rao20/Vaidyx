<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaidyx-TB Workflow Atlas</title>
<style>
/* Layout: a working reference. Sticky top bar with the role picker, a section rail on the left (a scrolling strip on phones),
   one section shown at a time. Tokens follow the Vaidyx-TB app (MONAI teal, Atkinson Hyperlegible, JetBrains Mono);
   stage colours follow the pitch deck: before blue, during teal, after green. */
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 100 549; font-display: swap; src: url(/fonts/AtkinsonHyperlegible-Regular.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 550 900; font-display: swap; src: url(/fonts/AtkinsonHyperlegible-Bold.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-style: italic; font-weight: 100 549; font-display: swap; src: url(/fonts/AtkinsonHyperlegible-Italic.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 100 900; font-display: swap; src: url(/fonts/JetBrainsMono-Regular.woff2) format("woff2"); }
:root {
  --bg: #f4f7f8; --panel: #ffffff; --panel-2: #f7fbfc; --ink: #1c2a33; --body: #3b4a55; --muted: #566572; --line: #d8e2e8; --line-2: #c3d0d8;
  --primary: #00c0b5; --on-primary: #0b1f24; --accent: #00877f; --link: #046483; --tint: #e3f4f5; --tint-line: #b3dfe2;
  --setup: #566572; --setup-s: #edf1f4; --before: #3e5cad; --before-s: #eaeefa; --during: #00877f; --during-s: #e2f4f3; --after: #1e6b45; --after-s: #e5f4ec;
  --ok: #1e6b45; --ok-s: #e5f4ec; --warn: #8a5300; --warn-s: #fdf1d8; --bad: #b23a2f; --bad-s: #fbe9e6; --rev: #5b3fc4; --rev-s: #efebff;
  --shadow: 0 1px 2px rgba(16, 42, 67, .06), 0 6px 16px rgba(16, 42, 67, .06); --radius: 10px;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171c; --panel: #152129; --panel-2: #192832; --ink: #e6eef2; --body: #c4d1d9; --muted: #93a4b0; --line: #26363f; --line-2: #33464f;
  --primary: #19c9bf; --on-primary: #06191c; --accent: #3fd0c6; --link: #6fc3df; --tint: #173338; --tint-line: #24575c;
  --setup: #a3b3bf; --setup-s: #1d2a32; --before: #93a8ea; --before-s: #1c2540; --during: #4fd3c9; --during-s: #133232; --after: #73cf9f; --after-s: #15302a;
  --ok: #73cf9f; --ok-s: #15302a; --warn: #f0b860; --warn-s: #33280f; --bad: #f08a80; --bad-s: #3a1c19; --rev: #b9a6ff; --rev-s: #261f45;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 16px rgba(0, 0, 0, .3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f171c; --panel: #152129; --panel-2: #192832; --ink: #e6eef2; --body: #c4d1d9; --muted: #93a4b0; --line: #26363f; --line-2: #33464f;
  --primary: #19c9bf; --on-primary: #06191c; --accent: #3fd0c6; --link: #6fc3df; --tint: #173338; --tint-line: #24575c;
  --setup: #a3b3bf; --setup-s: #1d2a32; --before: #93a8ea; --before-s: #1c2540; --during: #4fd3c9; --during-s: #133232; --after: #73cf9f; --after-s: #15302a;
  --ok: #73cf9f; --ok-s: #15302a; --warn: #f0b860; --warn-s: #33280f; --bad: #f08a80; --bad-s: #3a1c19; --rev: #b9a6ff; --rev-s: #261f45;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 16px rgba(0, 0, 0, .3); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-underline-offset: 2px; }
h1, h2, h3, h4 { color: var(--ink); line-height: 1.25; text-wrap: balance; margin: 0; }
h2 { font-size: 24px; } h3 { font-size: 17px; } h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); }
p { margin: 0; max-width: 72ch; color: var(--body); }
code, .mono { font-family: var(--mono); font-size: .86em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
[hidden] { display: none !important; }

/* top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 17px; } .brand span { font-size: 12.5px; color: var(--muted); }
.top .ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.top label { font-size: 13px; color: var(--muted); }
select, input[type=search], textarea { background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 10px; }
select { max-width: 100%; }
.saved { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--tint); border: 1px solid var(--tint-line); color: var(--ink); white-space: nowrap; }
.saved.off { background: var(--warn-s); border-color: var(--warn); color: var(--warn); }
.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--accent); background: var(--tint); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; }
.btn.sm { padding: 3px 9px; font-size: 13px; }

/* shell */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px); }
.rail { border-right: 1px solid var(--line); background: var(--panel); padding: 16px 10px; position: sticky; top: 61px; align-self: start; height: calc(100vh - 61px); overflow: auto; }
.rail a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--body); text-decoration: none; font-size: 14.5px; }
.rail a:hover { background: var(--tint); color: var(--ink); }
.rail a.on { background: var(--tint); color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--accent); }
.rail a .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.rail .grp { margin: 14px 10px 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
main { min-width: 0; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
section.view { display: flex; flex-direction: column; gap: 20px; }
.lede { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--link); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.flat { box-shadow: none; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; color: var(--body); }
ul.plain li { max-width: 80ch; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 1.4; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--body); white-space: nowrap; }
.chip.built { background: var(--ok-s); border-color: transparent; color: var(--ok); }
.chip.partial { background: var(--warn-s); border-color: transparent; color: var(--warn); }
.chip.missing { background: var(--panel); border-style: dashed; color: var(--muted); }
.chip.high { background: var(--bad-s); color: var(--bad); border-color: transparent; }
.chip.medium { background: var(--warn-s); color: var(--warn); border-color: transparent; }
.chip.low { background: var(--panel-2); color: var(--muted); }
.chip.eng { font-family: var(--mono); font-size: 11.5px; }
.chip.eng.qwen { border-color: var(--warn); } .chip.eng.gemma { border-color: var(--rev); } .chip.eng.rules { border-color: var(--line-2); }
.chip.link { cursor: pointer; } .chip.link:hover { border-color: var(--accent); }
.stg { font-weight: 700; } .stg.setup { color: var(--setup); } .stg.before { color: var(--before); } .stg.during { color: var(--during); } .stg.after { color: var(--after); }
.band { border-left: 4px solid var(--line-2); }
.band.setup { border-left-color: var(--setup); } .band.before { border-left-color: var(--before); } .band.during { border-left-color: var(--during); } .band.after { border-left-color: var(--after); }

/* overview */
.stages { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.stagecard { text-align: left; cursor: pointer; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow); }
.stagecard:hover { border-color: var(--accent); }
.stagecard.setup { border-top: 4px solid var(--setup); } .stagecard.before { border-top: 4px solid var(--before); } .stagecard.during { border-top: 4px solid var(--during); } .stagecard.after { border-top: 4px solid var(--after); }
.stagecard .cnt { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-size: 26px; font-variant-numeric: tabular-nums; color: var(--ink); }
.tile span { font-size: 13.5px; color: var(--body); }
.tile i { font-style: normal; font-size: 12px; color: var(--muted); }
.cast { display: flex; flex-wrap: wrap; gap: 8px; }
.howto { background: var(--tint); border: 1px solid var(--tint-line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }

/* roles */
.picker { display: flex; flex-wrap: wrap; gap: 6px; }
.picker button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 14px; }
.picker button.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 700; }
.picker button.missing { border-style: dashed; }
.picker .lbl { width: 100%; font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-top: 6px; }
.profile-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; justify-content: space-between; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; }
.kv dt { color: var(--muted); font-size: 13.5px; } .kv dd { margin: 0; color: var(--body); }
blockquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 0 8px 8px 0; color: var(--body); font-style: italic; }
.stagecols { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.stagecol { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stagecol.setup { border-top: 3px solid var(--setup); } .stagecol.before { border-top: 3px solid var(--before); } .stagecol.during { border-top: 3px solid var(--during); } .stagecol.after { border-top: 3px solid var(--after); }

/* swimlane */
table.t { border-collapse: collapse; width: 100%; font-size: 14px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
table.t thead th { background: var(--panel-2); font-size: 12.5px; color: var(--muted); font-weight: 700; position: sticky; top: 0; }
table.swim th.lane, table.swim td.cell { text-align: center; width: 76px; min-width: 76px; font-size: 12px; }
table.swim th.lane.miss { color: var(--muted); font-style: italic; }
table.swim td.step { min-width: 240px; }
table.swim tr.srow { cursor: pointer; }
table.swim tr.srow:hover td { background: var(--tint); }
table.swim tr.dim td { opacity: .35; }
table.swim .hl { background: color-mix(in srgb, var(--primary) 12%, transparent); }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: middle; }
.dot.do { background: var(--accent); }
.dot.in { border: 2px solid var(--accent); }
.dot.miss { border: 2px dashed var(--muted); }
.sid { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 6px; }
tr.detail td { background: var(--panel-2); }
.detailbox { display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 8px; max-width: 900px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; }

/* matrix */
table.mx td.c, table.mx th.c { text-align: center; width: 84px; min-width: 84px; }
.code { display: inline-block; min-width: 26px; padding: 1px 6px; border-radius: 6px; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.code.Y { background: var(--ok-s); color: var(--ok); } .code.O, .code.D { background: var(--before-s); color: var(--before); }
.code.L, .code.R { background: var(--during-s); color: var(--during); } .code.U { background: var(--warn-s); color: var(--warn); }
.code.N { color: var(--muted); } .code.dash { color: var(--muted); }
table.mx th.c.hl, table.mx td.c.hl { background: color-mix(in srgb, var(--primary) 12%, transparent); }
.note { font-size: 12.5px; color: var(--muted); }

/* marks */
.mk { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mk button.m { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
.mk button.m:hover { border-color: var(--accent); }
.mk button.m.on.keep { background: var(--ok-s); border-color: var(--ok); color: var(--ok); font-weight: 700; }
.mk button.m.on.change { background: var(--warn-s); border-color: var(--warn); color: var(--warn); font-weight: 700; }
.mk button.m.on.discuss { background: var(--rev-s); border-color: var(--rev); color: var(--rev); font-weight: 700; }
.mk button.m.cm.has { border-color: var(--link); color: var(--link); font-weight: 700; }
.mk .stamp { font-size: 12px; color: var(--muted); }
.cbox { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.cbox textarea { width: 100%; min-height: 76px; resize: vertical; }
.gnote { border-top: 1px dashed var(--line-2); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.gnote textarea { width: 100%; min-height: 90px; resize: vertical; }

/* gaps and ideas */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13.5px; }
.filters button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.item { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.item.sev-high { border-left: 4px solid var(--bad); } .item.sev-medium { border-left: 4px solid var(--warn); } .item.sev-low { border-left: 4px solid var(--line-2); }
.item h3 { font-size: 15.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.item .where { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ideas-banner { background: var(--rev-s); color: var(--rev); border-radius: var(--radius); padding: 10px 14px; font-weight: 700; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 40; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* phones */
@media (max-width: 920px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .top { position: static; }
  .kv dd .chip, .row .chip.link { white-space: normal; text-align: left; overflow-wrap: anywhere; }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); z-index: 10; }
  .rail .grp { display: none; }
  .rail a { white-space: nowrap; padding: 6px 10px; } .rail a .n { display: none; }
  .kv { grid-template-columns: minmax(0, 1fr); } .kv dt { margin-top: 6px; }
  .grid.two { grid-template-columns: minmax(0, 1fr); }
  h2 { font-size: 21px; }
  .top .ctl { margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Vaidyx-TB Workflow Atlas</b><span>Who does what, at each stage of the Tumour Board · as built on branch the-ui</span></div>
  <div class="ctl">
    <label for="viewas">View as</label>
    <select id="viewas"></select>
    <span class="saved" id="saved" title="Where your marks and comments are saved">Connecting...</span>
    <button class="btn sm" id="theme" title="Switch light / dark">Theme</button>
  </div>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main><div class="wrap" id="main"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="doctors.js"></script>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
