name: gate

# The CI gate: the green tick on a commit. A commit is released to the doctors' instance only when this passes
# (deploy/h200/deploy_h200.sh checks it). The GPU checks (models, Q&A and summary evals) stay on the H200.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The PDF toolkit first (its own venv, like /data/vaidyx/venv/pdf on the H200), then the app's Python on top.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"   # the H200 pdf venv

      - name: PDF toolkit for the demo hospital's documents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          python -m venv "$RUNNER_TEMP/pdf"
          "$RUNNER_TEMP/pdf/bin/python" -m pip install --disable-pip-version-check -q pip==26.2.1
          "$RUNNER_TEMP/pdf/bin/python" -m pip install --disable-pip-version-check -q -r requirements-ci-pdf.lock
          echo "TB_PDF_PYTHON=$RUNNER_TEMP/pdf/bin/python" >> "$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"   # the doctors' site venv on the H200 (tb_deploy312, Python 3.12)

      - name: Secret scan (every tracked file)
        run: scripts/secret_scan.sh --tree

      - name: Secret scan (the pushed commits)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then scripts/secret_scan.sh --range "$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            scripts/secret_scan.sh --range "$BEFORE..HEAD"
          else scripts/secret_scan.sh --range "$(git rev-list --max-parents=0 HEAD | tail -1)..HEAD"; fi

      - name: Shell scripts parse
        run: for f in deploy/vm/setup-vm.sh deploy/h200/vx.sh deploy/h200/deploy_h200.sh scripts/secret_scan.sh scripts/install_hooks.sh; do bash -n "$f"; done

      - name: Install the locked packages
        run: |
          python -m pip install --disable-pip-version-check pip==26.2.1   # the H200 venv's pip
          python -m pip install --disable-pip-version-check -r requirements-ci.lock

      # Tests listed in deploy/ci/h200_only_tests.txt need a file that is not in the repo; deploy_h200.sh runs them on
      # the H200 before every release.
      - name: Unit tests (Tumour Board, demo hospital, deployment gate)
        run: |
          deselect=$(grep -v '^#' deploy/ci/h200_only_tests.txt | grep . | sed 's/^/--deselect=/' | tr '\n' ' ')
          python -m pytest tumour_board/tests his_mock/tests deploy/tests -q -p no:cacheprovider $deselect

      - name: Dependency advisories (report only)
        continue-on-error: true
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0 && pip-audit -r requirements-ci.lock --progress-spinner off
