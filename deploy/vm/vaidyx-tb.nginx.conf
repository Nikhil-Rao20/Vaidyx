# Vaidyx-TB on the shared VM (deployment Plan B, see deploy/README.md). Installed by setup-vm.sh as
# /etc/nginx/sites-available/vaidyx-tb. Our own server_name only: RHV's default server and TQC's site are not touched.
# Everything except /vx-link goes through the secure link (127.0.0.1:17000, opened by the H200) to the H200's gate.

log_format vx_noquery '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
limit_req_zone $binary_remote_addr zone=vx_login:10m rate=10r/m;
map $http_upgrade $vx_conn_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vaidyx-tb-8-231-83-210.sslip.io;

    ssl_certificate     /etc/vaidyx-tb/lego/certificates/vaidyx-tb-8-231-83-210.sslip.io.crt;
    ssl_certificate_key /etc/vaidyx-tb/lego/certificates/vaidyx-tb-8-231-83-210.sslip.io.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;

    access_log /var/log/nginx/vaidyx-tb.access.log vx_noquery;   # no query strings: they can hold UHIDs or names
    error_log  /var/log/nginx/vaidyx-tb.error.log warn;
    client_max_body_size 60m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The H200 opens the secure link here (chisel over WebSocket); password + key checked by chisel itself.
    location = /vx-link {
        proxy_pass http://127.0.0.1:17999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vx_conn_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
    }

    # Sign-in: limited per real visitor address (the app behind the link sees one address for everyone).
    location = /api/auth/login {
        limit_req zone=vx_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/vaidyx-tb/nginx/vaidyx-proxy.conf;
    }

    # The gate's health check is for the H200's watchdog only.
    location ^~ /_gate/ {
        return 404;
    }

    location / {
        include /etc/vaidyx-tb/nginx/vaidyx-proxy.conf;
    }

    # The link or the H200 is down: a plain maintenance page instead of an nginx error.
    error_page 502 504 =503 @vx_down;
    location @vx_down {
        root /mnt/data/vaidyx-tb/www;
        try_files /maintenance.html =503;
        add_header Strict-Transport-Security "max-age=31536000" always;   # a location's own add_header drops the server's
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }
}
