# Included by vaidyx-tb.nginx.conf for every path except /vx-link. Installed as /etc/vaidyx-tb/nginx/vaidyx-proxy.conf.
proxy_pass http://127.0.0.1:17000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;      # replaces anything the visitor sent
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Upgrade $http_upgrade;               # the two live channels (meetings, messages)
proxy_set_header Connection $vx_conn_upgrade;
include /etc/vaidyx-tb/gate-header.conf;             # proxy_set_header X-Vaidyx-Gate "<secret>" (root 0600, not in git)
proxy_connect_timeout 10s;
proxy_read_timeout 900s;                              # long AI answers and summaries
proxy_send_timeout 900s;
proxy_buffering off;                                  # streamed answers
proxy_request_buffering off;                          # uploads stream through
